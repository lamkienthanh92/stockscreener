name: Daily VN30 data fetch (chậm, rate-limited)

on:
  schedule:
    # 08:00 sáng giờ VN (UTC+7) = 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # cho phép bấm chạy tay trên GitHub

permissions:
  contents: write   # BẮT BUỘC để job có quyền git push ngược lại repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Lấy dữ liệu mới (chạy chậm)
        run: python fetch_data.py

      - name: Chạy phân tích, xuất recommendations.json
        run: python analysis.py

      - name: Commit lại dữ liệu + kết quả mới
        run: |
          git config user.name "vn30-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/vn30_all_daily.csv frontend/public/recommendations.json
          git diff --cached --quiet || git commit -m "Cập nhật dữ liệu tự động $(date +'%Y-%m-%d')"
          git push
